name: Dogfood release
run-name: Dogfood ${{ github.event.client_payload.upstream_tag }}

# `repository_dispatch` always loads this workflow from trusted default-branch
# code. The dogfood source SHA is validated before any checkout.
on:
  repository_dispatch:
    types: [dogfood-release]

permissions:
  contents: read

concurrency:
  group: fork-dogfood-automation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate dogfood source and release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.validate.outputs.source_sha }}
      upstream_version: ${{ steps.validate.outputs.upstream_version }}
      upstream_tag: ${{ steps.validate.outputs.upstream_tag }}
      dogfood_version: ${{ steps.validate.outputs.dogfood_version }}
      release_tag: ${{ steps.validate.outputs.release_tag }}
    steps:
      - name: Validate inputs, dogfood head, and duplicate release
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          UPSTREAM_TAG: ${{ github.event.client_payload.upstream_tag }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          DOGFOOD_REVISION: ${{ github.event.client_payload.dogfood_revision || '1' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$UPSTREAM_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::upstream_tag must be a stable v<major>.<minor>.<patch> tag"
            exit 1
          fi
          upstream_version="${BASH_REMATCH[1]}"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-character commit SHA"
            exit 1
          fi
          if [[ ! "$DOGFOOD_REVISION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::dogfood_revision must be a positive integer"
            exit 1
          fi
          upstream_release_tag="$(
            gh api "repos/can1357/oh-my-pi/releases/tags/${UPSTREAM_TAG}" \
              --jq 'select(.draft == false and .prerelease == false) | .tag_name'
          )"
          if [[ "$upstream_release_tag" != "$UPSTREAM_TAG" ]]; then
            echo "::error::${UPSTREAM_TAG} is not a published stable upstream release"
            exit 1
          fi
          latest_revision="$(
            gh api --paginate --slurp "repos/${REPOSITORY}/releases?per_page=100" |
              jq -r --arg pattern "^v${upstream_version}-dogfood\\.(?<revision>[1-9][0-9]*)$" \
                '[.[][] | .tag_name | capture($pattern)? | select(.) | .revision | tonumber] | max // 0'
          )"
          if (( DOGFOOD_REVISION <= latest_revision )); then
            echo "::error::dogfood_revision must exceed published revision ${latest_revision} for ${UPSTREAM_TAG}"
            exit 1
          fi

          source_sha="${SOURCE_SHA,,}"

          dogfood_head="$(gh api "repos/${REPOSITORY}/git/ref/heads/dogfood" --jq '.object.sha')"
          if [[ "$dogfood_head" != "$source_sha" ]]; then
            echo "::error::source_sha is not the current dogfood branch head (expected ${dogfood_head})"
            exit 1
          fi

          dogfood_version="${upstream_version}-dogfood.${DOGFOOD_REVISION}"
          release_tag="v${dogfood_version}"
          if gh release view "$release_tag" --repo "$REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "::error::GitHub release ${release_tag} already exists"
            exit 1
          fi
          if gh api "repos/${REPOSITORY}/git/ref/tags/${release_tag}" >/dev/null 2>&1; then
            echo "::error::Git tag ${release_tag} already exists"
            exit 1
          fi

          {
            echo "source_sha=${source_sha}"
            echo "upstream_version=${upstream_version}"
            echo "upstream_tag=${UPSTREAM_TAG}"
            echo "dogfood_version=${dogfood_version}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build dogfood binaries
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      # The workflow itself came from main. This checkout is the validated,
      # exact dogfood source and does not persist a token into its git config.
      - name: Checkout validated dogfood source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Linux and Windows x64 native addons (Bazel)
        uses: ./.github/actions/bazel-natives
        with:
          targets: linux-x64-baseline linux-x64-modern win32-x64-baseline
      - name: Compile exactly the dogfood x64 binaries
        env:
          RELEASE_TARGETS: linux-x64,win32-x64
          DOGFOOD_REPOSITORY: ${{ github.repository }}
          DOGFOOD_VERSION: ${{ needs.validate.outputs.dogfood_version }}
        run: bun run ci:release:build-binaries
      - name: Smoke Linux dogfood binary
        env:
          DOGFOOD_VERSION: ${{ needs.validate.outputs.dogfood_version }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$(mktemp -d)"
          export HOME="$runtime_dir/home"
          export XDG_DATA_HOME="$runtime_dir/xdg"
          mkdir -p "$HOME" "$XDG_DATA_HOME"
          version_output="$(packages/coding-agent/binaries/omp-dogfood-linux-x64 --version)"
          expected="omp/${DOGFOOD_VERSION}"
          if [[ "$version_output" != "$expected" ]]; then
            echo "::error::dogfood version mismatch: expected ${expected}, got ${version_output}"
            exit 1
          fi
          packages/coding-agent/binaries/omp-dogfood-linux-x64 --smoke-test
      - name: Upload dogfood binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogfood-binaries
          if-no-files-found: error
          path: |
            packages/coding-agent/binaries/omp-dogfood-linux-x64
            packages/coding-agent/binaries/omp-dogfood-windows-x64.exe
          retention-days: 1

  publish:
    name: Publish dogfood release
    needs: [validate, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # No dogfood checkout or source-controlled action runs in this job. Only
      # the trusted workflow commands and the uploaded binary artifact execute
      # with contents: write.
      - name: Download dogfood binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dogfood-binaries
          path: release-assets
      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: |
          set -euo pipefail
          test -f omp-dogfood-linux-x64
          test -f omp-dogfood-windows-x64.exe
          sha256sum omp-dogfood-linux-x64 omp-dogfood-windows-x64.exe | sort -k2 > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2
      - name: Recheck source head and release is still absent
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          dogfood_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dogfood" --jq '.object.sha')"
          if [[ "$dogfood_head" != "$SOURCE_SHA" ]]; then
            echo "::error::dogfood branch advanced after validation; refusing to publish stale source ${SOURCE_SHA}"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "::error::GitHub release ${RELEASE_TAG} already exists"
            exit 1
          fi
      - name: Create normal GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          UPSTREAM_TAG: ${{ needs.validate.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Dogfood build of upstream ${UPSTREAM_TAG} at ${SOURCE_SHA}." \
            release-assets/omp-dogfood-linux-x64 \
            release-assets/omp-dogfood-windows-x64.exe \
            release-assets/SHA256SUMS
